services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chorus_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: chorus
    volumes:
      - chorus-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chorus_owner -d chorus']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: chorus-api:prod
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: .env.prod
    environment:
      HOST: '0.0.0.0'
    ports:
      - '127.0.0.1:18080:18080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: chorus-api:prod
    profiles: ['tools']
    command: ['node', 'packages/database/src/cli.ts']
    environment:
      DATABASE_URL: postgres://chorus_owner:${POSTGRES_PASSWORD}@postgres:5432/chorus
      CHORUS_APP_PASSWORD: ${CHORUS_APP_PASSWORD:?CHORUS_APP_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chorus-pg:
